<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>资产管理系统</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 暗色模式：三态（auto 跟随系统 / light / dark），偏好存 localStorage(asset.theme)
      // 内联在首屏执行，避免暗色用户看到白色闪烁；运行时切换由 src/utils/theme.ts 接管
      ;(function () {
        var mode = 'auto'
        try {
          var s = localStorage.getItem('asset.theme')
          if (s === 'light' || s === 'dark') mode = s
        } catch (e) {}
        var mq = window.matchMedia('(prefers-color-scheme: dark)')
        var apply = function () {
          document.documentElement.classList.toggle('dark', mode === 'dark' || (mode === 'auto' && mq.matches))
        }
        apply()
        mq.addEventListener('change', function () { if (mode === 'auto') apply() })
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
