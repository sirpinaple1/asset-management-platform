server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history 模式回退（vue-router 刷新不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 入口禁缓存：发版即生效，避免钉钉 webview 启发式缓存旧 bundle
    # （try_files 回退 /index.html 会内部重定向到此，SPA 深链同样命中）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 构建产物长缓存（文件名带 hash，内容不可变）
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
