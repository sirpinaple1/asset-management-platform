# CI/CD（asset-backend）：push 触发编译+全量单测验证，任意分支 push 自动构建并部署到 Lighthouse 演练沙箱
# 测试均为 Mockito/MockMvc 纯单测（无 Spring 上下文、无真实数据库依赖），Runner 无需额外服务。
# Runner 为 sirpinaple 本机 shell executor（Mac），直接复用本机 Maven 仓库（~/.m2），无需 CI 缓存。
#
# 部署目标：沙箱 193.112.174.178（演练环境）
#   - deploy：mvn package 产出 fat jar → 备份沙箱当前 jar → scp 新 jar → docker compose up -d --build asset-backend
#   - rollback：手动触发，恢复 /srv/backups/asset-backend.jar.prev（上一次部署前的版本）并重建容器

stages:
  - verify
  - deploy

# 非交互 shell 的 PATH 不含 brew/sdkman/nvm，统一补齐
.common_env: &common_env
  before_script:
    - export PATH="/opt/homebrew/bin:$HOME/.sdkman/candidates/java/current/bin:$HOME/.nvm/versions/node/v20.20.2/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
    - export JAVA_HOME="$HOME/.sdkman/candidates/java/current"
    - export DEPLOY_HOST="root@193.112.174.178"
    - export SSH_KEY="$HOME/.ssh/id_ed25519"

verify:
  <<: *common_env
  stage: verify
  script:
    - mvn clean verify -B

deploy:
  <<: *common_env
  stage: deploy
  script:
    # 1. 打包（跳过测试，verify 阶段已验）
    - mvn package -DskipTests -B
    # 2. 备份沙箱当前运行版本（供 rollback 使用；首次无则跳过）
    - ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no "$DEPLOY_HOST" 'test -f /srv/app/asset-backend/target/asset-backend.jar && cp -f /srv/app/asset-backend/target/asset-backend.jar /srv/backups/asset-backend.jar.prev || echo "no current jar to backup"'
    # 3. 推送新 jar 到沙箱
    - scp -i "$SSH_KEY" -o StrictHostKeyChecking=no target/asset-backend.jar "$DEPLOY_HOST:/srv/app/asset-backend/target/asset-backend.jar"
    # 4. 沙箱重建后端容器（Dockerfile COPY 新 jar → 新镜像 → 容器重建）
    - ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no "$DEPLOY_HOST" 'cd /srv && docker compose -f /srv/docker-compose.yml up -d --build asset-backend'
    # 5. 探活确认（等 20s 让 Spring Boot 起来，health=UP 才算成功）
    - ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no "$DEPLOY_HOST" 'sleep 20; docker compose -f /srv/docker-compose.yml ps --format "table {{.Name}}\t{{.Status}}" | grep asset-backend; curl -sk https://127.0.0.1/actuator/health'

# 一键回滚：Pipeline 页面手动点击触发，恢复到上一次部署前的 jar
rollback:
  <<: *common_env
  stage: deploy
  when: manual
  script:
    # 1. 检查备份是否存在
    - ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no "$DEPLOY_HOST" 'test -f /srv/backups/asset-backend.jar.prev || { echo "ERROR: 没有可回滚的备份版本（首次部署前无 prev）"; exit 1; }'
    # 2. 恢复 prev jar
    - ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no "$DEPLOY_HOST" 'cp -f /srv/backups/asset-backend.jar.prev /srv/app/asset-backend/target/asset-backend.jar && echo "jar restored from prev"'
    # 3. 重建容器
    - ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no "$DEPLOY_HOST" 'cd /srv && docker compose -f /srv/docker-compose.yml up -d --build asset-backend'
    # 4. 探活
    - ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no "$DEPLOY_HOST" 'sleep 20; docker compose -f /srv/docker-compose.yml ps --format "table {{.Name}}\t{{.Status}}" | grep asset-backend; curl -sk https://127.0.0.1/actuator/health'
