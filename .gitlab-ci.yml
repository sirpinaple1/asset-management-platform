# CI/CD（asset-frontend）：任意分支 push 自动构建并部署到 Lighthouse 演练沙箱
# Runner 为 sirpinaple 本机 shell executor（Mac）
#
# 流程（deploy）：npm ci → 注入生产 env → vite build（dist）→ 备份沙箱当前 dist → rsync 新 dist
#              → ssh 触发 docker compose up -d --build asset-frontend（沙箱 Dockerfile 单阶段 COPY dist）
# 回滚（rollback）：手动触发，恢复 /srv/backups/asset-frontend-dist.prev（上一次部署前的 dist）并重建容器

stages:
  - deploy

.common_env: &common_env
  before_script:
    # 非交互 shell 的 PATH 不含 nvm，统一补齐
    - export PATH="/opt/homebrew/bin:$HOME/.nvm/versions/node/v20.20.2/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
    - export DEPLOY_HOST="root@193.112.174.178"
    - export SSH_KEY="$HOME/.ssh/id_ed25519"

deploy:
  <<: *common_env
  stage: deploy
  script:
    # 1. 安装依赖（国内镜像）
    - npm config set registry https://registry.npmmirror.com
    - npm ci || npm install
    # 2. 注入生产构建环境变量（与沙箱网关路由一致）
    - printf 'VITE_API_BASE_URL=/api\nVITE_PROXY_TARGET=http://asset-backend:6006\nVITE_AUTH_CENTER_URL=https://193.112.174.178/auth-center\n' > .env.production
    # 3. 构建（vue-tsc 类型检查 + vite build）
    - npm run build
    # 4. 备份沙箱当前 dist（供 rollback 使用；首次无则跳过）
    - ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no "$DEPLOY_HOST" 'if [ -d /srv/app/asset-frontend/dist ] && [ "$(ls -A /srv/app/asset-frontend/dist)" ]; then rm -rf /srv/backups/asset-frontend-dist.prev && cp -r /srv/app/asset-frontend/dist /srv/backups/asset-frontend-dist.prev && echo "dist backup ok"; else echo "no current dist to backup"; fi'
    # 5. 推送新 dist 到沙箱（--delete 保证与本地产物一致）
    - rsync -az --delete -e "ssh -i $SSH_KEY -o StrictHostKeyChecking=no" dist/ "$DEPLOY_HOST:/srv/app/asset-frontend/dist/"
    # 6. 沙箱重建前端容器
    - ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no "$DEPLOY_HOST" 'cd /srv && docker compose -f /srv/docker-compose.yml up -d --build asset-frontend'
    # 7. 探活确认
    - ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no "$DEPLOY_HOST" 'sleep 8; docker compose -f /srv/docker-compose.yml ps --format "table {{.Name}}\t{{.Status}}" | grep asset-frontend; curl -sk -o /dev/null -w "frontend_http=%{http_code}\n" https://127.0.0.1/'

# 一键回滚：Pipeline 页面手动点击触发，恢复到上一次部署前的 dist
rollback:
  <<: *common_env
  stage: deploy
  when: manual
  script:
    # 1. 检查备份是否存在
    - ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no "$DEPLOY_HOST" 'test -d /srv/backups/asset-frontend-dist.prev || { echo "ERROR: 没有可回滚的备份版本（首次部署前无 prev）"; exit 1; }'
    # 2. 恢复 prev dist
    - ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no "$DEPLOY_HOST" 'rm -rf /srv/app/asset-frontend/dist && cp -r /srv/backups/asset-frontend-dist.prev /srv/app/asset-frontend/dist && echo "dist restored from prev"'
    # 3. 重建容器
    - ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no "$DEPLOY_HOST" 'cd /srv && docker compose -f /srv/docker-compose.yml up -d --build asset-frontend'
    # 4. 探活
    - ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no "$DEPLOY_HOST" 'sleep 8; docker compose -f /srv/docker-compose.yml ps --format "table {{.Name}}\t{{.Status}}" | grep asset-frontend; curl -sk -o /dev/null -w "frontend_http=%{http_code}\n" https://127.0.0.1/'
